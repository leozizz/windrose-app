name: Keep Render API Awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping-api:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Render API health endpoint
        env:
          HEALTHCHECK_URL: https://windrose-api.onrender.com/api
        run: |
          curl --fail --show-error --silent \
            --max-time 20 \
            --retry 3 \
            --retry-delay 5 \
            --retry-connrefused \
            "$HEALTHCHECK_URL"
